[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gridwise-energy-optimizer"
version = "1.3.0"
description = "LLM-assisted GridWise smart-campus energy optimization API"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "openai>=1.60,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["gridwise*"]

[tool.pytest.ini_options]
testpaths = ["gridwise/tests"]
addopts = "-ra"
